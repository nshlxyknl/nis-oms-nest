services:
  postgres:
    image: postgres:16-alpine
    container_name: oms-users-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oms_users
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
    ports:
      - "5434:5432"
    volumes:
      - oms_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d oms_users"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oms_users_data:
